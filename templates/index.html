<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Material Request System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">Warehouse Material Request System</span>
        <div>
            <span id="currentUser" class="text-white me-3"></span>
            <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none">Logout</button>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div id="alertBox"></div>

    <section id="authSection" class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="mb-3">Login</h3>
                    <form id="loginForm">
                        <input id="loginUsername" class="form-control mb-3" placeholder="Username" required>
                        <input id="loginPassword" type="password" class="form-control mb-3" placeholder="Password" required>
                        <button class="btn btn-primary w-100">Login</button>
                    </form>
                    <hr>
                    <h5>Create Employee Account</h5>
                    <form id="registerForm">
                        <input id="regUsername" class="form-control mb-2" placeholder="Username" required>
                        <input id="regEmail" type="email" class="form-control mb-2" placeholder="Email">
                        <input id="regPassword" type="password" class="form-control mb-2" placeholder="Password (6+ chars)" required>
                        <select id="regRole" class="form-select mb-2">
                            <option value="EMPLOYEE">Employee</option>
                            <option value="WAREHOUSE">Warehouse Employee</option>
                        </select>
                        <button class="btn btn-success w-100">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <section id="appSection" class="d-none">
        <div class="row g-3">
            <div class="col-md-7">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4>Find Materials</h4>
                        <div class="input-group mb-3">
                            <input id="searchInput" class="form-control" placeholder="Search material name/code">
                            <button id="searchBtn" class="btn btn-primary">Search</button>
                        </div>
                        <div id="inventoryResults"></div>
                    </div>
                </div>

                <div class="card shadow-sm mt-3">
                    <div class="card-body">
                        <h4>Create Material Request</h4>
                        <select id="warehouseSelect" class="form-select mb-3"></select>
                        <div id="cart"></div>
                        <textarea id="requestNotes" class="form-control mb-3" placeholder="Notes (optional)"></textarea>
                        <button id="submitRequestBtn" class="btn btn-success">Submit Request</button>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4>My Requests</h4>
                        <div id="myRequests"></div>
                    </div>
                </div>

                <div id="warehousePanel" class="card shadow-sm mt-3 d-none">
                    <div class="card-body">
                        <h4>Warehouse Requests</h4>
                        <div id="warehouseRequests"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
